services:
  # Backend API + WebSocket server on Render
  - type: web
    name: watchparty-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:socket_app --host 0.0.0.0 --port $PORT
    envVars:
      # Neon: set both in the Render dashboard (sync: false = not stored in git)
      - key: DATABASE_URL          # direct connection
        sync: false
      - key: DATABASE_URL_POOLED   # pooled connection (-pooler host)
        sync: false
      - key: FRONTEND_URL
        value: https://watchpartyt.netlify.app
      - key: SECRET_KEY
        generateValue: true
